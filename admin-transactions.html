<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions — Admin — AgriLink AI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboards.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  .action-btn {
    border: none; border-radius: 6px; cursor: pointer; font-weight: 600; padding: 6px 12px;
    font-size: 12px; transition: opacity 0.2s;
  }
  .action-btn:hover { opacity: 0.85; }
</style>
</head>
<body>
<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><i data-lucide="tractor"></i> AgriLink AI</div>
    </div>
    <nav class="nav-menu">
      <a href="dashboard-admin.html" class="nav-item">
        <i data-lucide="layout-dashboard"></i> Overview
      </a>
      <a href="admin-users.html" class="nav-item">
        <i data-lucide="users"></i> User Management
      </a>
      <a href="admin-transactions.html" class="nav-item active">
        <i data-lucide="receipt"></i> Transactions
      </a>
      <a href="admin-disputes.html" class="nav-item">
        <i data-lucide="alert-triangle"></i> Disputes
      </a>
      <a href="admin-reports.html" class="nav-item">
        <i data-lucide="file-text"></i> Reports
      </a>
      <a href="admin-analytics.html" class="nav-item">
        <i data-lucide="trending-up"></i> System Analytics
      </a>
    </nav>
    <div class="sidebar-footer">
      <a href="#" id="logoutBtn" class="nav-item" style="color:#e74c3c;padding:0;">
        <i data-lucide="log-out"></i> Log Out
      </a>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar glass-panel">
      <h2 class="page-title">Transactions Monitor</h2>
      <div class="topbar-actions">
        <button id="notifBtn" class="btn-secondary" style="padding:8px 12px;display:flex;align-items:center;gap:8px;">
          <i data-lucide="bell" style="width:16px;height:16px;"></i> Notifications
        </button>
        <div class="user-profile">
          <div class="avatar" id="userAvatar">A</div>
          <span id="userName" style="font-weight:500;">Admin</span>
        </div>
      </div>
    </header>

    <div class="dashboard-container fade-in">
      <div class="grid-cards" style="margin-bottom:24px;">
        <div class="card-3d stat-card" style="background:linear-gradient(135deg,#1b5e20,#004d40);color:white;">
          <div class="stat-header" style="color:rgba(255,255,255,0.8);"><span>Total Completed Volume</span></div>
          <div class="stat-value" id="statTotalVolume">₹0</div>
        </div>
        <div class="card-3d stat-card">
          <div class="stat-header"><span>Platform Revenue (1% Fee)</span></div>
          <div class="stat-value" id="statTotalFee" style="color:var(--color-primary);">₹0</div>
        </div>
      </div>

      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;align-items:center;">
        <input type="date" id="txnStartDate" style="padding:10px 14px;border:1px solid #e0e0e0;border-radius:8px;">
        <span style="color:var(--text-muted);">to</span>
        <input type="date" id="txnEndDate" style="padding:10px 14px;border:1px solid #e0e0e0;border-radius:8px;">
        <select id="txnStatusFilter" style="padding:10px 14px;border:1px solid #e0e0e0;border-radius:8px;">
          <option value="all">All Status</option>
          <option value="completed">Completed</option>
          <option value="pending">Pending</option>
          <option value="cancelled">Cancelled</option>
          <option value="flagged">Flagged (With Dispute)</option>
        </select>
        <button id="exportTxnBtn" class="btn-primary" style="padding:10px 18px;display:flex;align-items:center;gap:8px;border:none;border-radius:8px;background:var(--color-primary);color:white;cursor:pointer;font-weight:600;">
          <i data-lucide="download" style="width:16px;height:16px;"></i> Export CSV
        </button>
      </div>

      <div class="dashboard-section glass-panel">
        <div class="section-title">System-wide Transactions</div>
        <div style="overflow-x:auto;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Txn ID</th>
                <th>Date</th>
                <th>Buyer</th>
                <th>Seller</th>
                <th>Produce</th>
                <th>Amount</th>
                <th>Fee (1%)</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="adminTransactionsTableBody">
              <tr><td colspan="9" style="text-align:center;padding:24px;">Loading transactions...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="js/admin.js"></script>
</body>
</html>
